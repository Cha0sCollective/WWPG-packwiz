name: Validate and build Prism pack
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [BASE, PINOUT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify.py --profile ${{ matrix.profile }}
      - run: python tools/build_prism.py --profile ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: WWPG-Prism-${{ matrix.profile }}
          path: build/distributions/*
